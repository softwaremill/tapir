name: CI
on:
  pull_request:
  push:
    branches: ['**']
    tags: [v*]
permissions:
  contents: write        # release-drafter, auto-merge requirement
  pull-requests: write   # labeler, auto-merge requirement    
env:
  # .sbtopts specifies 8g, which is needed to import into IntelliJ, but on GH that exceeds the maximum available memory
  SBT_OPTS: -Xms4g -Xmx4g
jobs:
  ci:
    # run on 1) push, 2) external PRs, 3) github-actions PRs
    # do not run on internal, non-steward PRs since those will be run by push to branch
    if: |
      github.event_name == 'push' || 
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.user.login == 'softwaremill-ci' ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scala-version: [ "2.12", "2.13", "3" ]
        target-platform: [ "JVM", "JS", "Native" ]
        java: [ "17", "21" ]
        exclude:
          - java: "21"
        include: # Restricted to build only specific Loom-based modules
          - scala-version: "2.13"
            target-platform: "JVM"
            java: "21"
          - scala-version: "3"
            target-platform: "JVM"
            java: "21"
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1, specifically v1.5.12
    - name: Set up JDK 
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        cache: 'sbt'
        java-version: ${{ matrix.java }}
    - name: Install sam cli
      if: matrix.java == '17'
      run: |
        wget -q https://github.com/aws/aws-sam-cli/releases/latest/download/aws-sam-cli-linux-x86_64.zip
        unzip -q aws-sam-cli-linux-x86_64.zip -d sam-installation
        sudo ./sam-installation/install --update
        sam --version
    - name: Install NPM
      if: matrix.java == '17'
      uses: actions/setup-node@v7
      with:
        node-version: 18
    - run: npm --version
    - name: Install AWS CDK
      if: matrix.java == '17'
      run: |
        npm install -g aws-cdk
        cdk --version
    - name: Install libidn2-dev libcurl3-dev
      if: matrix.target-platform == 'Native'
      run: |
        sudo apt-get update
        sudo apt-get install libidn2-dev libcurl3-dev
        echo "STTP_NATIVE=1" >> $GITHUB_ENV
    - name: Install scala-cli
      if: matrix.target-platform == 'JVM' && matrix.java == '21' && matrix.scala-version == '3'
      uses: VirtusLab/scala-cli-setup@3f5bf11a33bb88343238780c18257c8fa43789e1 # main, specifically v1.18.0
      with:
        jvm: '' # needed because scala-cli-setup otherwise forces the installation of their default JVM (17)
    - name: Enable Loom-specific modules
      if: matrix.java == '21'
      run: echo "ONLY_LOOM=1" >> $GITHUB_ENV
    - name: Compile
      run: sbt -v "compileScoped ${{ matrix.scala-version }} ${{ matrix.target-platform }}"
    - name: Compile core & server-core with next Scala 3
      if: matrix.scala-version == '3' && matrix.target-platform == 'JVM' && matrix.java == '21'
      env:
        SCALA_3_NEXT: "3.10.0"
      run: |
        sbt -v \
          "set LocalProject(\"core\") / scalaVersion := \"$SCALA_3_NEXT\" ;" \
          "set LocalProject(\"serverCore\") / scalaVersion := \"$SCALA_3_NEXT\" ;" \
          "set LocalProject(\"coreJS\") / scalaVersion := \"$SCALA_3_NEXT\" ;" \
          "set LocalProject(\"serverCoreJS\") / scalaVersion := \"$SCALA_3_NEXT\" ;" \
          "core/Test/compile ; serverCore/Test/compile ;" \
          "coreJS/Test/compile ; serverCoreJS/Test/compile"
        # sbt 2 reuses the (background) sbt server by default; we don't want to use SCALA_NEXT for subsequent steps
        sbt shutdown
    - name: Compile documentation
      if: matrix.target-platform == 'JVM' && matrix.java == '21'
      run: sbt -v compileDocumentation
    - name: Verify that examples compile using Scala CLI
      if: matrix.target-platform == 'JVM' && matrix.java == '21' && matrix.scala-version == '3'
      timeout-minutes: 15
      run: |
        # sometimes hangs with no output, before sbtn connects to the sbt server
        .github/scripts/thread-dump-watchdog.sh scala-cli-output.log 120 &
        WATCHDOG_PID=$!
        sbt -v examples/verifyExamplesCompileUsingScalaCli 2>&1 | tee scala-cli-output.log
        SBT_EXIT_CODE=${PIPESTATUS[0]}
        kill $WATCHDOG_PID 2>/dev/null || true
        exit $SBT_EXIT_CODE
    - name: Test
      if: matrix.target-platform != 'JS'
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v3, specifically v4.0.0
      with:
        # this step runs every server-backend suite; on a slower runner the total wall-clock approaches 10 min and 
        # flakily trips the timeout, with both attempts then timing out, so allow more room
        timeout_minutes: 15
        max_attempts: 2
        # the netty server interpreter tests include some which run a large number of requests, to detect potential leaks
        # storing the output to verify it in the next step
        command: |
          # the test run sometimes hangs silently (a stuck test or a wedged shutdown)
          .github/scripts/thread-dump-watchdog.sh output.log 240 &
          WATCHDOG_PID=$!
          sbt -v "testScoped ${{ matrix.scala-version }} ${{ matrix.target-platform }}" 2>&1 | tee output.log
          SBT_EXIT_CODE=${PIPESTATUS[0]}
          kill $WATCHDOG_PID 2>/dev/null || true
          exit $SBT_EXIT_CODE
    - name: Upload thread dumps (if hang occurred)
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: 'thread-dumps-${{ matrix.scala-version }}-${{ matrix.target-platform }}-${{ matrix.java }}'
        path: thread-dumps.log
        if-no-files-found: ignore
    - name: Check for reported leaks
      if: matrix.target-platform != 'JS'
      run: |
          if grep -q "LEAK" output.log; then
            echo "Leak detected!"
            exit 1
          fi
    - name: Test OpenAPI codegen
      if: matrix.target-platform == 'JVM' && (matrix.scala-version == '2.12' || matrix.scala-version == '3')
      run: sbt -v ${{ matrix.scala-version == '3' && 'openapiCodegenSbt/scripted' || 'openapiCodegenSbt2_12/scripted' }}
    # The finatra tests take a really long time (1/3 of the build duration); hence, they are disabled and need to be run separately
    #- name: Test finatra
    #  if: matrix.target-platform != 'JS'
    #  run: sbt -v testFinatra
    # Temporarily call JS tests for each subproject explicitly as a workaround until
    # https://github.com/scala-js/scala-js/issues/4317 has a solution
    - name: Test
      if: matrix.target-platform == 'JS' && matrix.scala-version == '2.12'
      run: sbt "catsJS2_12/testFull ; circeJsonJS2_12/testFull ; clientCoreJS2_12/testFull ; clientTestsJS2_12/testFull ; coreJS2_12/testFull ; enumeratumJS2_12/testFull ; jsoniterScalaJS2_12/testFull ; newtypeJS2_12/testFull ; openapiDocsJS2_12/testFull ; playJsonJS2_12/testFull ; redocJS2_12/testFull ; serverCoreJS2_12/testFull ; sttpClientJS2_12/testFull ; testingJS2_12/testFull ; testsJS2_12/testFull ; uPickleJsonJS2_12/testFull ; zioJsonJS2_12/testFull"
    - name: Test
      if: matrix.target-platform == 'JS' && matrix.scala-version == '2.13'
      run: sbt "catsJS2_13/testFull ; circeJsonJS2_13/testFull ; clientCoreJS2_13/testFull ; clientTestsJS2_13/testFull ; coreJS2_13/testFull ; enumeratumJS2_13/testFull ; jsoniterScalaJS2_13/testFull ; newtypeJS2_13/testFull ; openapiDocsJS2_13/testFull ; playJsonJS2_13/testFull ; redocJS2_13/testFull ; serverCoreJS2_13/testFull ; sttpClientJS2_13/testFull ; testingJS2_13/testFull ; testsJS2_13/testFull ; uPickleJsonJS2_13/testFull ; zioJsonJS2_13/testFull"
    - name: Test
      if: matrix.target-platform == 'JS' && matrix.scala-version == '3'
      run: sbt "catsJS/testFull ; circeJsonJS/testFull ; clientCoreJS/testFull ; clientTestsJS/testFull ; coreJS/testFull ; jsoniterScalaJS/testFull ; openapiDocsJS/testFull ; redocJS/testFull ; serverCoreJS/testFull ; sttpClientJS/testFull ; testingJS/testFull ; testsJS/testFull ; uPickleJsonJS/testFull ; zioJsonJS/testFull"
    - uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: 'tests-results-${{ matrix.scala-version }}-${{ matrix.target-platform }}-${{ matrix.java }}'
        path: '**/test-reports/TEST*.xml'
    - name: Prepare release notes
      if: github.ref == 'refs/heads/master' # this should not run on PR builds
      uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v6, specifically v7.10.0
      with:
        config-name: release-drafter.yml
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # identify binary incompatibilities (check build.sbt for details)
  mima:
    uses: softwaremill/github-actions-workflows/.github/workflows/mima.yml@main
    with:
      java-version: '21'
      java-opts: '-Xms4g -Xmx4g' # SBT_OPTS env parameter

  publish:
    name: Publish release
    needs: [ci]
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    strategy:
      matrix: 
        java: [ "17", "21" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1, specifically v1.5.12
      - name: Set up JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'sbt'
      - name: Install libidn2-dev libcurl3-dev
        if: matrix.java == '17'
        run: |
          sudo apt-get update
          sudo apt-get install libidn2-dev libcurl3-dev
      - name: Enable Native-specific modules
        if: matrix.java == '17'
        run: echo "STTP_NATIVE=1" >> $GITHUB_ENV
      - name: Enable Loom-specific modules
        if: matrix.java == '21'
        run: echo "ONLY_LOOM=1" >> $GITHUB_ENV
      - name: Compile
        run: |
          sbt "compile ; shutdown"
      - name: Publish artifacts
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      - name: Extract version from commit message
        if: matrix.java == '17'
        run: |
          version=${GITHUB_REF/refs\/tags\/v/}
          echo "VERSION=$version" >> $GITHUB_ENV
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
      - name: Publish release notes
        if: matrix.java == '17'
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v6, specifically v7.10.0
        with:
          config-name: release-drafter.yml
          publish: true
          name: "v${{ env.VERSION }}"
          tag: "v${{ env.VERSION }}"
          version: "v${{ env.VERSION }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  label:
    # only for PRs by softwaremill-ci
    if: github.event.pull_request.user.login == 'softwaremill-ci'
    uses: softwaremill/github-actions-workflows/.github/workflows/label.yml@main
    secrets: inherit

  auto-merge-github-actions:
    # only for PRs by softwaremill-ci
    if: github.event.pull_request.user.login == 'softwaremill-ci'
    needs: [ ci, mima, label ]
    uses: softwaremill/github-actions-workflows/.github/workflows/auto-merge.yml@main
    secrets: inherit

  auto-merge-dependabot:
    # only for PRs by dependabot[bot]
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    needs: [ ci, mima ]
    uses: softwaremill/github-actions-workflows/.github/workflows/auto-merge.yml@main
    secrets:
      github-token: ${{ secrets.SOFTWAREMILL_CI_PR_TOKEN }}
